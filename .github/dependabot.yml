version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node 22 is the runtime (package.json engines); newer @types/node describes APIs we do not have.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # A TypeScript major changes the compiler; upgrade on purpose, not from a bot PR.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
